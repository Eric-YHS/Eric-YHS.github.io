name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Jekyll config must be valid YAML
        run: python -c "import yaml; yaml.safe_load(open('_config.yml')); print('_config.yml ok')"

      - name: CNAME must keep the custom domain
        run: |
          test "$(tr -d '\r\n' < CNAME)" = "ericyhs.me" || {
            echo "CNAME must contain exactly ericyhs.me, found: $(cat CNAME)"; exit 1; }
          echo 'CNAME ok'

      - name: Page must stay a single dependency-free document
        run: |
          python3 - <<'PY'
          import re, sys
          html = open("index.html", encoding="utf-8").read()
          problems = []
          if not re.search(r"<!doctype html>", html, re.I):
              problems.append("index.html: missing <!DOCTYPE html>")
          if 'lang="' not in html:
              problems.append("index.html: <html> needs a lang attribute")
          if not re.search(r"<title>[^<]+</title>", html, re.I):
              problems.append("index.html: missing a <title>")
          # The documented design is: no JavaScript, no external fonts/CSS, no analytics.
          for tag, pattern in (
              ("script", r"<script\b[^>]*\bsrc="),
              ("link stylesheet", r"<link\b[^>]*stylesheet"),
              ("iframe", r"<iframe\b"),
              ("img", r"<img\b[^>]*\bsrc=[\"']https?://"),
          ):
              if re.search(pattern, html, re.I):
                  problems.append(f"index.html: external {tag} found - the page is meant to be dependency-free")
          if "@import" in html or "@font-face" in html:
              problems.append("index.html: web fonts found - only system fonts are allowed")
          if "prefers-color-scheme" not in html:
              problems.append("index.html: prefers-color-scheme media query is missing")
          for problem in problems:
              print("error:", problem)
          raise SystemExit(1 if problems else 0)
          print("index.html ok  (self-contained, light/dark, no external assets)")
          PY

      - name: Every project card must point at an existing public repository
        run: |
          python3 - <<'PY'
          import re, sys, urllib.error, urllib.request
          from urllib.parse import urlparse

          html = open("index.html", encoding="utf-8").read()
          links = sorted(set(re.findall(r'href="(https://[^"]+)"', html)))
          broken, checked = [], 0
          for url in links:
              path = urlparse(url).path
              # only validate own-account repo cards; the profile link is a different shape
              if not re.fullmatch(r"/Eric-YHS/[^/]+", path):
                  continue
              checked += 1
              request = urllib.request.Request(
                  f"https://api.github.com/repos{path}",
                  headers={"Accept": "application/vnd.github+json",
                           "User-Agent": "pages-ci"},
              )
              try:
                  urllib.request.urlopen(request, timeout=30)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      broken.append(url)
                  else:
                      print(f"warning: {url} -> HTTP {exc.code}, not treating as broken")
          if broken:
              print("Project cards linking to repositories that no longer exist:")
              print("\n".join(broken))
              sys.exit(1)
          print(f"ok  {checked} project card links resolve")
          PY

  # 密钥一旦 commit 进历史就很难清干净（science-pop 就漏过一个 Coze PAT）。
  # 这里只匹配高置信度的前缀，不做熵分析，避免把 CI 变成误报噪音。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for committed credentials
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          PATTERNS = [
              ("GitHub token", re.compile(r"\b(ghp|gho|ghu|ghs|ghr)_[0-9A-Za-z]{20,}\b")),
              ("GitHub fine-grained PAT", re.compile(r"\bgithub_pat_[0-9A-Za-z_]{30,}\b")),
              ("OpenAI-style key", re.compile(r"\bsk-[0-9A-Za-z_-]{20,}\b")),
              ("AWS access key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("Slack token", re.compile(r"\bxox[baprs]-[0-9A-Za-z-]{10,}\b")),
              ("Google API key", re.compile(r"\bAIza[0-9A-Za-z_-]{30,}\b")),
              ("WeChat app secret", re.compile(
                  r"(?i)\b(wxappsecret|wx_app_secret|app_secret)\b\s*[:=]\s*['\"]?([0-9a-f]{32})['\"]?")),
              ("Coze PAT", re.compile(r"\bpat_[0-9A-Za-z]{20,}\b")),
          ]
          SKIP = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".pdf", ".zip", ".gz",
                  ".pkl", ".pt", ".pth", ".ckpt", ".onnx", ".bin", ".dll", ".so", ".pdb",
                  ".docx", ".hdr", ".ttf", ".woff", ".woff2", ".mp3", ".mp4", ".wav", ".h5",
                  ".safetensors", ".lock", ".whl", ".jar", ".class"}

          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                 text=True).stdout.split("\0")
          hits = []
          for name in filter(None, files):
              if name.endswith(tuple(SKIP)):
                  continue
              try:
                  blob = open(name, "rb").read(2 * 1024 * 1024)
              except OSError:
                  continue
              if b"\0" in blob:
                  continue
              text = blob.decode("utf-8", "replace")
              for label, pat in PATTERNS:
                  for m in pat.finditer(text):
                      hits.append(f"{label}: {name}: {m.group(0)[:24]}")
          if hits:
              print("\n".join(hits))
              sys.exit("发现疑似明文密钥（见上）；确认是误报就把该文件加进 SKIP 或换成占位符")
          print(f"ok  已扫描 {len([f for f in files if f])} 个文件，未发现明文密钥")
          PY
